parameters:
- name: branchName
  displayName: Branch Name
  type: string
  values:
    - main
    - develop
    - staging
  default: main

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '10.0.x'

- script: |
    rm -rf bin obj publish MyApi
    dotnet clean --configuration Release
  displayName: Clean

- script: dotnet restore
  displayName: Restore

- script: |
    rm -rf bin/Release/net10.0/MyApi
    echo "Building from branch: ${{ parameters.branchName }}"
    dotnet build --configuration Release
  displayName: Build

- script: dotnet publish --configuration Release --output $(Build.ArtifactStagingDirectory)
  displayName: Publish

- script: echo "Deploying to PRODUCTION from main branch"
  condition: eq('${{ parameters.branchName }}', 'main')
  displayName: Production Deployment

- script: echo "Deploying to STAGING from develop branch"
  condition: eq('${{ parameters.branchName }}', 'develop')
  displayName: Development Deployment

- script: echo "Deploying to STAGING environment"
  condition: eq('${{ parameters.branchName }}', 'staging')
  displayName: Staging Deployment

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
